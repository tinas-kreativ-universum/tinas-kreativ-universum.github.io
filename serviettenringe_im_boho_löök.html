            />

    </main>

    <script type="application/javascript">
        // Mobile nav toggle
        const navToggle = document.getElementById('navToggle');
        const mainNav   = document.getElementById('mainNav');
        if (navToggle && mainNav) {
            navToggle.addEventListener('click', () => {
                const isOpen = mainNav.classList.toggle('is-open');
                navToggle.setAttribute('aria-expanded', isOpen);
            });
        }

        // Custom Card Carousel JS
        document.addEventListener('DOMContentLoaded', () => {
            const carousels = document.querySelectorAll('.carousel');
            carousels.forEach(carousel => {
                const items      = carousel.querySelectorAll('.carousel-item');
                const indicators = carousel.querySelectorAll('.carousel-indicators button');
                const prevBtn    = carousel.querySelector('.carousel-control-prev');
                const nextBtn    = carousel.querySelector('.carousel-control-next');

                if (items.length === 0) return;

                let currentIndex = 0;

                function showSlide(index) {
                    if (index < 0)              index = items.length - 1;
                    else if (index >= items.length) index = 0;

                    items[currentIndex].classList.remove('active');
                    if (indicators.length > currentIndex) indicators[currentIndex].classList.remove('active');

                    currentIndex = index;
                    items[currentIndex].classList.add('active');
                    if (indicators.length > currentIndex) indicators[currentIndex].classList.add('active');
                }

                if (prevBtn) prevBtn.addEventListener('click', e => { e.preventDefault(); showSlide(currentIndex - 1); });
                if (nextBtn) nextBtn.addEventListener('click', e => { e.preventDefault(); showSlide(currentIndex + 1); });

                indicators.forEach((indicator, index) => {
                    indicator.addEventListener('click', e => { e.preventDefault(); showSlide(index); });
                });
            });
        });
    </script>
</body>
</html>
